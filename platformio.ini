; Pro Micro nRF52840 / nice!nano clone.
; Bootloader on this board is UF2 0.6.0 with SoftDevice S140 6.1.1,
; so the app must start at 0x26000. Do not update the bootloader.
[env:promicro_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
extra_scripts = pre:extra_script.py
board_build.variant = promicro
lib_deps =
    bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
